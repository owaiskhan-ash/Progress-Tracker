name: Build Android release APK

on:
  push:
    branches: [arena/46480fcb-progress-tracker]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT" /opt/android-sdk /usr/local/android-sdk -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::Android SDK manager not found. ANDROID_HOME=$SDK_ROOT"
            ls -la "$SDK_ROOT" 2>&1 || true
            exit 1
          fi
          SDK_ROOT="$(dirname "$(dirname "$(dirname "$(dirname "$SDKMANAGER")")")")"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "Using $SDKMANAGER from $SDK_ROOT"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies and sync Capacitor
        run: |
          npm ci
          npm run android:sync

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Project-Tracker-debug.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Project-Tracker-debug-apk
          path: android/app/build/outputs/apk/debug/Project-Tracker-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish tagged GitHub release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          gh release create "$TAG" android/app/build/outputs/apk/debug/Project-Tracker-debug.apk --target "$GITHUB_SHA" --title "Project Tracker $TAG" --notes-file .github/release-notes.md
