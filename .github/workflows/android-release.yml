name: Build Android release APK

on:
  push:
    branches: [arena/46480fcb-progress-tracker]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android platform and build tools
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies and sync Capacitor
        run: |
          npm ci
          npm run android:sync

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Project-Tracker-debug.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Project-Tracker-debug-apk
          path: android/app/build/outputs/apk/debug/Project-Tracker-debug.apk
          if-no-files-found: error
          retention-days: 7
