name: Build Android release APK

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  android-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies and sync Capacitor
        run: |
          npm ci
          npm run android:sync

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Project-Tracker-${{ github.event.release.tag_name }}-debug.apk

      - name: Attach APK to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/Project-Tracker-${{ github.event.release.tag_name }}-debug.apk
          fail_on_unmatched_files: true
