<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#d9ff36" />
  <meta name="description" content="Track project progress and milestones on your device." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>Project tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="device" aria-label="Project tracker app preview">
    <div class="status-bar"><span id="clock">9:41</span><span class="status-right"><i class="signal"></i><i class="wifi"></i><i class="battery"></i></span></div>
    <section id="app" class="app-screen"></section>
    <div class="gesture-bar"><span></span></div>
  </main>
  <div class="preview-caption">PROJECT TRACKER <span>APP PREVIEW · 01</span></div>
  <div id="toast" class="toast" aria-live="polite"></div>
  <script src="native-bridge.bundle.js"></script>
  <script src="app.js"></script>
</body>
</html>
